[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]  # 关键配置：指定依赖目录

# 编译器配置
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
remappings = [
    "forge-std/=dependencies/forge-std-1.16.0/src",
    "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.0.2/contracts/",
]

# 依赖配置 - 仅需包名和版本
[dependencies]
"@openzeppelin-contracts" = { version = "5.0.2" }
forge-std = "1.16.0"




# Soldeer 的全局配置
[soldeer]
remappings_generate = false
remappings_location = "config"   # 可写可不写，已经不起作用
remappings_prefix = ""
recursive_deps = false





